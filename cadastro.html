<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Smart Control</title>
    <link rel="stylesheet" href="assets/css/cadastro.css">
</head>
<body>

    <main class="container">
        <div class="card" id= info-cadastro>
            <h1>Faça seu Cadastro</h1>
            <img src="assets/images/logo_transparent.png" alt="logo smart control">
            <p>Preencha o formulario abaixo com os respectivos dados cadastrais.</p>
            <form method="get" action="dashboard.html">
                <label for="nome">Nome Completo</label>
                <input type="text" name="nome" id="nome" required>

                <label for="email">E-mail Corporativo</label>
                <input type="email" name="email" id="email" required>

                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" placeholder="Deve conter pelo menos 8 caracteres" minlength="8">

                <label for="nivel_acesso">Nivel de Acesso</label>
                <select name="nivel_acesso" id="nivel_acesso" required>
                    <option value="">Selecione o nivel de acesso</option>
                    <option value="admin">Administrador</option>
                    <option value="user">Usuário</option>
                </select>

                
                <label for="termos" class="label-termos">
                    <input type="checkbox" id="termos">
                    Aceito os termos de uso
                </label>

                <button type="submit">Cadastrar</button>
                <p>Já possui uma conta? <a href="index.html">Clique aqui para fazer login</a></p>
            </form>
        </div>

    </main>
</body>
</html>
